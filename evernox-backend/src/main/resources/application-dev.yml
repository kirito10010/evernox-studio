server:
  port: 11002

# dev profile：本地开发用，打开 SQL 与 debug 日志。
# 注意口令同样走环境变量，不要在此写字面量。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/evernox_backend?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
    username: ${EVERNOX_DB_USERNAME:root}
    password: ${EVERNOX_DB_PASSWORD}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.evernox: debug
