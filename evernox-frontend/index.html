<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EverNox - 永夜照相馆</title>
    <script>
      try {
        var t = localStorage.getItem('evernox_theme') || 'light'
        if (['light', 'dark', 'celadon', 'lotus'].indexOf(t) < 0) t = 'light'
        document.documentElement.setAttribute('data-theme', t)
        if (t === 'dark') document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #eef5fd;
      }
      html[data-theme='dark'], html[data-theme='dark'] body {
        background: #0f1621;
      }
      /* 青瓷 */
      html[data-theme='celadon'], html[data-theme='celadon'] body {
        background: #edf7f3;
      }
      /* 藕荷 */
      html[data-theme='lotus'], html[data-theme='lotus'] body {
        background: #f8f3f9;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
