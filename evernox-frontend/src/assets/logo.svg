<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10b981;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer ring -->
  <circle cx="60" cy="60" r="52" fill="none" stroke="url(#auroraGrad)" stroke-width="3" opacity="0.6" />
  <!-- Inner abstract aperture / camera lens shape -->
  <circle cx="60" cy="60" r="36" fill="none" stroke="url(#auroraGrad)" stroke-width="2" opacity="0.3" />
  <!-- Aperture blades (abstract) -->
  <path d="M60 24 L72 48 L60 42 Z" fill="url(#auroraGrad)" opacity="0.7" filter="url(#glow)" />
  <path d="M92 44 L72 52 L78 42 Z" fill="url(#auroraGrad)" opacity="0.6" filter="url(#glow)" />
  <path d="M92 76 L72 68 L80 76 Z" fill="url(#innerGrad)" opacity="0.6" filter="url(#glow)" />
  <path d="M60 96 L48 72 L60 78 Z" fill="url(#innerGrad)" opacity="0.7" filter="url(#glow)" />
  <path d="M28 76 L48 68 L40 76 Z" fill="url(#auroraGrad)" opacity="0.6" filter="url(#glow)" />
  <path d="M28 44 L48 52 L42 42 Z" fill="url(#auroraGrad)" opacity="0.5" filter="url(#glow)" />
  <!-- Center dot -->
  <circle cx="60" cy="60" r="8" fill="url(#auroraGrad)" filter="url(#glow)" />
  <circle cx="60" cy="60" r="4" fill="#fff" opacity="0.9" />
</svg>
