worker_processes  1;

events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;

    keepalive_timeout  65;

    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   1024;
    gzip_vary         on;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen       80;
        server_name  localhost;

        # 前端静态文件：相对路径，相对于 nginx.exe 所在目录（即 nginx-1.30.4 目录）
        root   dist_1;
        index  index.html;

        client_max_body_size 10m;

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # 公告 SSE 长连接：关闭缓冲、延长超时，避免事件延迟或被 300s 断开
        location /api/announcement/stream {
            proxy_pass http://127.0.0.1:11002;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 应援板 SSE 长连接：同样关闭缓冲、延长超时，保证像素实时推送
        location /api/support-board/stream {
            proxy_pass http://127.0.0.1:11002;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 攻城战（沙盘）SSE 长连接。
        # 缺了这段就会落到下面的通用 /api/ 块：那里 proxy_buffering 是默认的 on
        # → 事件会积压到缓冲区满才吐给浏览器，且 300s 无数据就被断开。
        location /api/game/stream {
            proxy_pass http://127.0.0.1:11002;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # 组织积分 SSE 长连接：同上
        location /api/points/stream {
            proxy_pass http://127.0.0.1:11002;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:11002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }

}
